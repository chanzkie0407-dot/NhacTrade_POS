<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — NhacTrade POS</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body { padding: 15px; }
    .locked-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .locked-box {
      background: white; padding: 30px; border-radius: 12px;
      border: 3px solid #dc2626; text-align: center; max-width: 400px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="admin-content">
    <h2>👑 Admin / Owner Dashboard</h2>
    <button class="btn-danger" onclick="doLogout()">🚪 Logout</button>
    <hr style="margin:15px 0;">

    <!-- PRIVACY PIN STATUS — Iisang Source Lang -->
    <div class="card">
      <h3>🔐 Privacy Pin Status</h3>
      <p>Failed Attempts: <strong id="attempt-count">0</strong>/5</p>
      <p id="system-status" style="color:green; font-weight:bold;">✅ System Unlocked</p>
      <button class="btn-primary" onclick="recheckPin()">🔑 Re-verify Pin</button>
    </div>

    <!-- STORE MANAGEMENT -->
    <div class="card">
      <h3>🏪 Store Management</h3>
      <input type="text" id="store-name" placeholder="Store Name">
      <input type="text" id="store-location" placeholder="Location (Optional)">
      <button class="btn-success" onclick="addStore()">➕ Add Store</button>
      <hr style="margin:10px 0;">
      <h4>List of Stores</h4>
      <div id="store-list"><em>No stores added yet</em></div>
    </div>

    <!-- CASHIER MANAGEMENT -->
    <div class="card">
      <h3>👤 Cashier Management</h3>
      <input type="text" id="cashier-name" placeholder="Full Name">
      <input type="text" id="cashier-pass" placeholder="4-digit Password" maxlength="4">
      <button class="btn-success" onclick="addCashier()">➕ Add Cashier</button>
      <hr style="margin:10px 0;">
      <h4>List of Cashiers</h4>
      <div id="cashier-list"><em>No cashiers added yet</em></div>
    </div>
  </div>

  <!-- LOCKED OVERLAY -->
  <div id="locked-overlay" class="locked-overlay hidden">
    <div class="locked-box">
      <h2 style="color:#dc2626;">🔒 SYSTEM LOCKED</h2>
      <p>Reached 5 failed PIN attempts</p>
      <p>Contact <strong>Service Provider</strong> to unlock</p>
      <br>
      <button class="btn-danger" onclick="doLogout()">🚪 Logout</button>
    </div>
  </div>

  <script src="../firebase-config.js"></script>
  <script>
    let stores = [];
    let cashiers = [];
    let pinVerified = false;

    // ==============================================
    // SHARED PIN STATE — SAME SA LAHAT NG PAGE
    // ==============================================
    function getPinState() {
      return {
        currentPin: localStorage.getItem('privacyPin') || '1234',
        failedAttempts: parseInt(localStorage.getItem('failedAttempts') || '0'),
        isLocked: localStorage.getItem('isLocked') === 'true'
      };
    }

    function savePinState(state) {
      localStorage.setItem('failedAttempts', state.failedAttempts);
      localStorage.setItem('isLocked', state.isLocked);
      updatePinUI();
    }

    function updatePinUI() {
      const state = getPinState();
      document.getElementById('attempt-count').textContent = state.failedAttempts;
      
      if (state.isLocked) {
        document.getElementById('system-status').textContent = '🔒 SYSTEM LOCKED — Contact SP';
        document.getElementById('system-status').style.color = '#dc2626';
        document.getElementById('locked-overlay').classList.remove('hidden');
      } else {
        document.getElementById('system-status').textContent = '✅ System Unlocked';
        document.getElementById('system-status').style.color = '#16a34a';
        document.getElementById('locked-overlay').classList.add('hidden');
      }
    }

    async function verifyPin() {
      const state = getPinState();
      if (state.isLocked) {
        alert('🔒 SYSTEM LOCKED — Contact Service Provider');
        return false;
      }

      const inputPin = prompt('🔐 Enter Privacy Pin:');
      if (!inputPin) return false;

      if (inputPin === state.currentPin) {
        localStorage.setItem('failedAttempts', '0');
        pinVerified = true;
        updatePinUI();
        return true;
      } else {
        state.failedAttempts++;
        if (state.failedAttempts >= 5) {
          state.isLocked = true;
          alert(`❌ Maximum attempts reached! System Locked`);
        } else {
          alert(`❌ Wrong Pin! ${5 - state.failedAttempts} attempt(s) remaining`);
        }
        savePinState(state);
        return false;
      }
    }

    async function recheckPin() {
      pinVerified = false;
      await verifyPin();
    }

    // ==============================================
    // PROTECTED ACTIONS — Pin muna bago mag-proceed
    // ==============================================
    async function requirePin() {
      if (pinVerified) return true;
      return await verifyPin();
    }

    // ==============================================
    // FIRESTORE DATA LOAD
    // ==============================================
    async function loadData() {
      updatePinUI();
      const state = getPinState();
      if (state.isLocked) return;

      try {
        await loadStores();
        await loadCashiers();
      } catch (err) {
        console.error('Load error:', err);
        alert('⚠️ Error loading data: ' + err.message);
      }
    }

    async function loadStores() {
      const snapshot = await db.collection('stores').get();
      stores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderStoreList();
      notifyParentStoreUpdate();
    }

    async function loadCashiers() {
      const snapshot = await db.collection('cashiers').get();
      cashiers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderCashierList();
    }

    // ==============================================
    // STORE MANAGEMENT
    // ==============================================
    async function addStore() {
      if (!(await requirePin())) return;

      const name = document.getElementById('store-name').value.trim();
      const location = document.getElementById('store-location').value.trim();

      if (!name) { alert("⚠️ Ilagay ang Store Name!"); return; }

      try {
        await db.collection('stores').add({
          name,
          location: location || '',
          createdAt: new Date()
        });
        document.getElementById('store-name').value = '';
        document.getElementById('store-location').value = '';
        await loadStores();
        alert("✅ Store added successfully!");
      } catch (err) {
        alert("❌ Error adding store: " + err.message);
      }
    }

    function renderStoreList() {
      const list = document.getElementById('store-list');
      if (stores.length === 0) {
        list.innerHTML = "<em>No stores added yet</em>";
        return;
      }
      list.innerHTML = stores.map(s => `
        <div style="padding:10px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>${s.name}</strong>
            ${s.location ? `<br><small style="color:#666;">📍 ${s.location}</small>` : ''}
          </div>
          <button class="btn-danger" style="padding:6px 12px; font-size:14px;" onclick="deleteStore('${s.id}')">🗑️ Delete</button>
        </div>
      `).join('');
    }

    async function deleteStore(id) {
      if (!(await requirePin())) return;
      if (!confirm("❌ Burahin ba talaga ang store na ito?")) return;

      try {
        await db.collection('stores').doc(id).delete();
        await loadStores();
      } catch (err) {
        alert("❌ Error deleting: " + err.message);
      }
    }

    // ==============================================
    // CASHIER MANAGEMENT
    // ==============================================
    async function addCashier() {
      if (!(await requirePin())) return;

      const name = document.getElementById('cashier-name').value.trim();
      const pass = document.getElementById('cashier-pass').value.trim();

      if (!name || !pass) { alert("⚠️ Ilagay ang Pangalan at Password!"); return; }
      if (pass.length !== 4) { alert("⚠️ Dapat 4 na numero lang ang Password!"); return; }

      try {
        await db.collection('cashiers').add({
          name,
          password: pass,
          createdAt: new Date()
        });
        document.getElementById('cashier-name').value = '';
        document.getElementById('cashier-pass').value = '';
        await loadCashiers();
        alert("✅ Cashier added successfully!");
      } catch (err) {
        alert("❌ Error adding cashier: " + err.message);
      }
    }

    function renderCashierList() {
      const list = document.getElementById('cashier-list');
      if (cashiers.length === 0) {
        list.innerHTML = "<em>No cashiers added yet</em>";
        return;
      }
      list.innerHTML = cashiers.map(c => `
        <div style="padding:10px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>${c.name}</strong><br>
            <small style="color:#666;">Password: ${c.password}</small>
          </div>
          <button class="btn-danger" style="padding:6px 12px; font-size:14px;" onclick="deleteCashier('${c.id}')">🗑️ Delete</button>
        </div>
      `).join('');
    }

    async function deleteCashier(id) {
      if (!(await requirePin())) return;
      if (!confirm("❌ Burahin ba talaga ang cashier na ito?")) return;

      try {
        await db.collection('cashiers').doc(id).delete();
        await loadCashiers();
      } catch (err) {
        alert("❌ Error deleting: " + err.message);
      }
    }

    // ==============================================
    // LOGOUT — Gumagana kahit sa iframe
    // ==============================================
    function doLogout() {
      if (parent && parent.doLogout) {
        parent.doLogout();
      } else {
        window.location.href = '../index.html';
      }
    }

    function notifyParentStoreUpdate() {
      if (parent.updateStoreDropdownInner) {
        parent.updateStoreDropdownInner(stores);
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
