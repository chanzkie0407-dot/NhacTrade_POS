<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — NhacTrade POS</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body { padding: 10px; }
    .locked-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .locked-box {
      background: white; padding: 30px; border-radius: 12px;
      border: 3px solid red; text-align: center;
    }
  </style>
</head>
<body>
  <div id="admin-content">
    <h2>👑 Admin / Owner Dashboard</h2>
    <button class="btn-danger" onclick="parent.doLogout()">Logout</button>
    <hr style="margin:15px 0;">

    <!-- PRIVACY PIN STATUS -->
    <div class="card" id="pin-status-card">
      <h3>🔐 Privacy Pin Status</h3>
      <p>Failed Attempts: <strong id="attempt-count">0</strong>/5</p>
      <p id="system-status" style="color:green; font-weight:bold;">✅ System Unlocked</p>
      <button class="btn-primary" onclick="recheckPin()">🔑 Re-verify Pin</button>
    </div>

    <!-- STORE MANAGEMENT -->
    <div class="card">
      <h3>🏪 Store Management</h3>
      <input type="text" id="store-name" placeholder="Store Name">
      <input type="text" id="store-location" placeholder="Location (Optional)">
      <button class="btn-success" onclick="addStore()">➕ Add Store</button>
      <hr style="margin:10px 0;">
      <h4>List of Stores</h4>
      <div id="store-list"><em>No stores added yet</em></div>
    </div>

    <!-- CASHIER MANAGEMENT -->
    <div class="card">
      <h3>👤 Cashier Management</h3>
      <input type="text" id="cashier-name" placeholder="Full Name">
      <input type="text" id="cashier-pass" placeholder="4-digit Password" maxlength="4">
      <button class="btn-success" onclick="addCashier()">➕ Add Cashier</button>
      <hr style="margin:10px 0;">
      <h4>List of Cashiers</h4>
      <div id="cashier-list"><em>No cashiers added yet</em></div>
    </div>
  </div>

  <!-- LOCKED OVERLAY -->
  <div id="locked-overlay" class="locked-overlay" style="display:none;">
    <div class="locked-box">
      <h2 style="color:red;">🔒 SYSTEM LOCKED</h2>
      <p>Reached 5 failed attempts</p>
      <p>Contact <strong>Service Provider</strong> to Unlock</p>
      <button class="btn-danger" onclick="parent.doLogout()">Logout</button>
    </div>
  </div>

  <script src="../firebase-config.js"></script>
  <script>
    let stores = [];
    let cashiers = [];
    let pinVerified = false;

    // === PIN VERIFICATION SYSTEM ===
    function getState() {
      return {
        currentPin: localStorage.getItem('privacyPin') || '1234',
        failedAttempts: parseInt(localStorage.getItem('failedAttempts') || '0'),
        isLocked: localStorage.getItem('isLocked') === 'true'
      };
    }

    function saveState(state) {
      localStorage.setItem('failedAttempts', state.failedAttempts);
      localStorage.setItem('isLocked', state.isLocked);
      updateStatusUI();
    }

    function updateStatusUI() {
      const state = getState();
      document.getElementById('attempt-count').textContent = state.failedAttempts;
      
      if (state.isLocked) {
        document.getElementById('system-status').textContent = '🔒 SYSTEM LOCKED — Contact SP';
        document.getElementById('system-status').style.color = 'red';
        document.getElementById('locked-overlay').style.display = 'flex';
      } else {
        document.getElementById('system-status').textContent = '✅ System Unlocked';
        document.getElementById('system-status').style.color = 'green';
        document.getElementById('locked-overlay').style.display = 'none';
      }
    }

    async function verifyPin() {
      const state = getState();
      if (state.isLocked) {
        alert('🔒 SYSTEM LOCKED — Please contact Service Provider');
        return false;
      }

      const inputPin = prompt('🔐 Enter Privacy Pin:');
      if (!inputPin) return false;

      if (inputPin === state.currentPin) {
        // Correct — reset attempts
        localStorage.setItem('failedAttempts', '0');
        pinVerified = true;
        updateStatusUI();
        return true;
      } else {
        // Wrong — increment attempts
        state.failedAttempts++;
        if (state.failedAttempts >= 5) {
          state.isLocked = true;
          alert(`❌ Wrong Pin! No attempts left — SYSTEM LOCKED`);
        } else {
          alert(`❌ Wrong Pin! ${5 - state.failedAttempts} attempt(s) remaining`);
        }
        saveState(state);
        return false;
      }
    }

    async function recheckPin() {
      pinVerified = false;
      await verifyPin();
    }

    // === PROTECTED ACTION WRAPPERS ===
    async function protectedAction(fn) {
      if (!pinVerified) {
        const ok = await verifyPin();
        if (!ok) return;
      }
      await fn();
    }

    // === LOAD DATA ===
    async function loadData() {
      const state = getState();
      updateStatusUI();
      
      if (state.isLocked) return; // Don't load if locked
      
      await loadStores();
      await loadCashiers();
    }

    async function loadStores() {
      if (!db) return;
      const snap = await db.collection('stores').get();
      stores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderStoreList();
      updateStoreDropdown();
    }

    async function loadCashiers() {
      if (!db) return;
      const snap = await db.collection('cashiers').get();
      cashiers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCashierList();
    }

    // === STORE ===
    async function addStore() {
      await protectedAction(async () => {
        const name = document.getElementById('store-name').value.trim();
        const location = document.getElementById('store-location').value.trim();
        if (!name) { alert("⚠️ Ilagay ang Store Name!"); return; }
        await db.collection('stores').add({
          name, location: location || '', createdAt: new Date()
        });
        document.getElementById('store-name').value = '';
        document.getElementById('store-location').value = '';
        await loadStores();
        alert("✅ Store added successfully!");
      });
    }

    function renderStoreList() {
      const list = document.getElementById('store-list');
      if (stores.length === 0) {
        list.innerHTML = "<em>No stores added yet</em>";
        return;
      }
      list.innerHTML = stores.map(s => `
        <div style="padding:8px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <div><strong>${s.name}</strong>${s.location ? `<br><small>${s.location}</small>` : ''}</div>
          <button class="btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteStore('${s.id}')">Delete</button>
        </div>
      `).join('');
    }

    async function deleteStore(id) {
      await protectedAction(async () => {
        if (!confirm("❌ Burahin ba talaga?")) return;
        await db.collection('stores').doc(id).delete();
        await loadStores();
      });
    }

    // === CASHIER ===
    async function addCashier() {
      await protectedAction(async () => {
        const name = document.getElementById('cashier-name').value.trim();
        const pass = document.getElementById('cashier-pass').value.trim();
        if (!name || !pass) { alert("⚠️ Ilagay ang Pangalan at Password!"); return; }
        if (pass.length !== 4) { alert("⚠️ Dapat 4 na numero lang ang Password!"); return; }
        await db.collection('cashiers').add({
          name, password: pass, createdAt: new Date()
        });
        document.getElementById('cashier-name').value = '';
        document.getElementById('cashier-pass').value = '';
        await loadCashiers();
        alert("✅ Cashier added successfully!");
      });
    }

    function renderCashierList() {
      const list = document.getElementById('cashier-list');
      if (cashiers.length === 0) {
        list.innerHTML = "<em>No cashiers added yet</em>";
        return;
      }
      list.innerHTML = cashiers.map(c => `
        <div style="padding:8px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <div><strong>${c.name}</strong><br><small>Password: ${c.password}</small></div>
          <button class="btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteCashier('${c.id}')">Delete</button>
        </div>
      `).join('');
    }

    async function deleteCashier(id) {
      await protectedAction(async () => {
        if (!confirm("❌ Burahin ba talaga?")) return;
        await db.collection('cashiers').doc(id).delete();
      });
    }

    // Update store dropdown in parent
    function updateStoreDropdown() {
      if (parent.updateStoreDropdownInner) parent.updateStoreDropdownInner(stores);
    }

    window.onload = loadData;
  </script>
</body>
</html>
