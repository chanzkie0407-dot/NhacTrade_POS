<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPOS - General Business System</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f4f8; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    input, select { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 6px; width: 250px; }
    .hidden { display: none !important; }
    .status-indicator { font-size: 13px; margin-left: 10px; }
    .status-ready { color: #16a34a; }
    .status-wait { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center; color:#1e40af; margin-bottom:20px;">
      BPOS - General Business System
      <span id="firebase-status" class="status-indicator status-wait">⏳ Connecting...</span>
    </h1>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
      <h2>🔐 Login</h2>
      <select id="user-role">
        <option value="">-- Select Role --</option>
        <option value="admin">Admin / Owner</option>
        <option value="cashier">Cashier</option>
        <option value="sp">Service Provider</option>
      </select>
      <br>
      <input type="password" id="user-password" placeholder="Enter Password">
      <br>
      <button class="btn-primary" onclick="login()" id="login-btn">Login</button>
      <p id="login-error" style="color:red; margin-top:10px;"></p>
    </div>

    <script>
      // ==============================================
      // FIREBASE CONFIG
      // ==============================================
      const firebaseConfig = {
        apiKey: "AIzaSyAxuB4gacmWIf3U4Ic5TsOxSHCaynR0vhw",
        authDomain: "bpos-pos.firebaseapp.com",
        projectId: "bpos-pos",
        storageBucket: "bpos-pos.firebasestorage.app",
        messagingSenderId: "1024558399693",
        appId: "1:1024558399693:web:569e4e8207d5a75f32a984",
        measurementId: "G-9LLPPB482N"
      };

      // === GLOBAL VARIABLES — NAKAUNA NA ✅ ===
      let db = null;
      let currentUser = null;
      let inactivityTimer = null;
      let cashiers = [];
      let stores = [];
      const DEFAULT_PASS = {
        admin: "8888",
        sp: "19970407chan"
      };

      // === INITIALIZE FIREBASE ===
      async function initFirebase() {
        try {
          firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          
          // Enable offline mode
          await db.enablePersistence({ synchronizeTabs: true });
          console.log("✅ Offline mode ready");
          
          // Update status
          document.getElementById('firebase-status').textContent = "● Connected";
          document.getElementById('firebase-status').className = "status-indicator status-ready";
          
        } catch (err) {
          console.error("❌ Firebase error:", err);
          document.getElementById('firebase-status').textContent = "⚠️ Error: " + err.code;
        }
      }

      // === DATA LOADERS ===
      async function loadCashiers() {
        if (!db) return;
        try {
          const snap = await db.collection('cashiers').get();
          cashiers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (err) {
          console.log("No cashiers yet — will add later");
          cashiers = [];
        }
      }
      
      async function loadStores() {
        if (!db) return;
        try {
          const snap = await db.collection('stores').get();
          stores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (err) {
          console.log("No stores yet — will add later");
          stores = [];
        }
      }

      // === SCREEN MANAGEMENT ===
      function showScreen(screenId) {
        document.getElementById('login-screen').classList.add('hidden');
        document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
        const el = document.getElementById(screenId);
        if (el) el.classList.remove('hidden');
      }

      // === AUTO-LOGOUT ===
      function resetInactivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
          doLogout();
          alert("⏰ Auto-logout: 10 minutes idle! Log in again.");
        }, 10 * 60 * 1000);
      }

      // === LOGOUT ===
      function doLogout() {
        currentUser = null;
        if (inactivityTimer) clearTimeout(inactivityTimer);
        document.getElementById('user-role').value = '';
        document.getElementById('user-password').value = '';
        document.getElementById('login-error').textContent = '';
        document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
        document.getElementById('login-screen').classList.remove('hidden');
      }

      // === LOGIN FUNCTION ===
      async function login() {
        if (!db) {
          alert("⏳ Connecting to server... Please try again in 3 seconds.");
          return;
        }
        
        const role = document.getElementById('user-role').value;
        const pass = document.getElementById('user-password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = "";

        if (!role) {
          errorEl.textContent = "⚠️ Select a role first!";
          return;
        }

        // Admin Login
        if (role === 'admin') {
          try {
            const adminDoc = await db.collection('credentials').doc('admin').get();
            const adminPass = adminDoc.exists && adminDoc.data() && adminDoc.data().password
              ? adminDoc.data().password 
              : DEFAULT_PASS.admin;
            
            if (pass === adminPass) {
              currentUser = { role, id: 'admin', name: 'Admin' };
              await loadStores();
              await loadCashiers();
              showScreen('screen-admin');
              resetInactivityTimer();
              return;
            } else {
              errorEl.textContent = "❌ Wrong password!";
              return;
            }
          } catch (err) {
            console.log("Using default admin password");
            if (pass === DEFAULT_PASS.admin) {
              currentUser = { role, id: 'admin', name: 'Admin' };
              await loadStores();
              await loadCashiers();
              showScreen('screen-admin');
              resetInactivityTimer();
              return;
            }
            errorEl.textContent = "❌ Wrong password!";
            return;
          }
        }

        // SP Login
        if (role === 'sp') {
          try {
            const spDoc = await db.collection('credentials').doc('sp').get();
            const spPass = spDoc.exists && spDoc.data() && spDoc.data().password
              ? spDoc.data().password 
              : DEFAULT_PASS.sp;
            
            if (pass === spPass) {
              currentUser = { role, id: 'sp', name: 'Service Provider' };
              showScreen('screen-sp');
              resetInactivityTimer();
              return;
            } else {
              errorEl.textContent = "❌ Wrong password!";
              return;
            }
          } catch (err) {
            console.log("Using default SP password");
            if (pass === DEFAULT_PASS.sp) {
              currentUser = { role, id: 'sp', name: 'Service Provider' };
              showScreen('screen-sp');
              resetInactivityTimer();
              return;
            }
            errorEl.textContent = "❌ Wrong password!";
            return;
          }
        }

        // Cashier Login
        if (role === 'cashier') {
          await loadCashiers();
          const found = cashiers.find(c => c.password === pass);
          if (found) {
            currentUser = { role, id: found.id, name: found.name };
            await loadStores();
            showScreen('cashier-select-store');
            resetInactivityTimer();
            return;
          } else {
            errorEl.textContent = "❌ Cashier not found or wrong password!";
            return;
          }
        }
      }

      // Reset timer on activity
      document.addEventListener('click', resetInactivityTimer);
      document.addEventListener('keydown', resetInactivityTimer);
      
      // === START FIREBASE ===
      initFirebase();
    </script>

    <!-- CASHIER: Select Store -->
    <div id="cashier-select-store" class="screen hidden card">
      <h2>👤 Cashier — Select Store</h2>
      <p>Welcome!</p>
      <select id="selected-store">
        <option value="">-- Choose Store --</option>
      </select>
      <br><br>
      <button class="btn-primary" onclick="cashierSelectStore()">Continue</button>
      <button class="btn-danger" onclick="doLogout()">Logout</button>
    </div>

    <!-- CASHIER: Start Shift -->
    <div id="cashier-start-shift" class="screen hidden card">
      <h2>🕐 Start Shift</h2>
      <label>Enter Opening Cash Float (₱):</label><br>
      <input type="number" id="cash-float" placeholder="e.g. 5000" min="0">
      <br><br>
      <button class="btn-success" onclick="startShift()">✅ Start Shift</button>
      <button class="btn-danger" onclick="doLogout()">Logout</button>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="screen-admin" class="screen hidden card">
      <h2>👑 Admin / Owner Dashboard</h2>
      <button class="btn-danger" onclick="doLogout()">Logout</button>
      <hr style="margin:15px 0;">
      <p>✅ Admin base loaded — Store & Cashier Management next!</p>
    </div>

    <!-- SP SCREEN -->
    <div id="screen-sp" class="screen hidden card">
      <h2>🛠️ Service Provider</h2>
      <button class="btn-danger" onclick="doLogout()">Logout</button>
      <hr style="margin:15px 0;">
      <p>✅ SP base loaded — Subscription & Password Controls next!</p>
    </div>

    <script>
      // === POPULATE STORE DROPDOWN ===
      function updateStoreDropdown() {
        const select = document.getElementById('selected-store');
        if (select && stores.length > 0) {
          select.innerHTML = '<option value="">-- Choose Store --</option>';
          stores.forEach(s => {
            select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
          });
        }
      }
      
      setTimeout(updateStoreDropdown, 500);

      // === CASHIER SELECT STORE ===
      function cashierSelectStore() {
        const select = document.getElementById('selected-store');
        if (!select.value) {
          alert("Select a store first!");
          return;
        }
        showScreen('cashier-start-shift');
      }

      // === START SHIFT ===
      function startShift() {
        const float = document.getElementById('cash-float').value;
        if (!float || float <= 0) {
          alert("Enter valid cash float amount!");
          return;
        }
        alert("✅ Shift started! POS features loading next babe 💛");
      }
    </script>
  </div>
</body>
</html>
