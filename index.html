<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NhacTrade POS — BPOS System</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .screen { display: none; }
    .screen.active { display: block; }
    iframe { border: none; width: 100%; height: 85vh; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center; color:#1e40af; margin-bottom:20px;">
      NhacTrade POS — BPOS System
      <span id="firebase-status" class="status-indicator status-wait">⏳ Connecting...</span>
    </h1>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card screen active">
      <h2>🔐 Login</h2>
      <select id="user-role">
        <option value="">-- Select Role --</option>
        <option value="admin">Admin / Owner</option>
        <option value="cashier">Cashier</option>
        <option value="sp">Service Provider</option>
      </select>
      <br><br>
      <input type="password" id="user-password" placeholder="Enter Password">
      <br><br>
      <button class="btn-primary" onclick="login()">Login</button>
      <p id="login-error" style="color:red; margin-top:10px;"></p>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="screen-admin" class="screen">
      <iframe src="roles/admin.html"></iframe>
    </div>

    <!-- CASHIER SCREEN -->
    <div id="screen-cashier" class="screen">
      <iframe src="roles/cashier.html"></iframe>
    </div>

    <!-- SP SCREEN -->
    <div id="screen-sp" class="screen">
      <iframe src="roles/sp.html"></iframe>
    </div>
  </div>

  <!-- Load Shared Modules -->
  <script src="firebase-config.js"></script>
  <script src="shared/auth.js"></script>
  <script>
    // Show only one screen
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => {
        el.classList.remove('active');
      });
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');
    }

    // Override auth.js showScreen
    window.showScreen = showScreen;

    // Update Firebase Status
    setTimeout(() => {
      const status = document.getElementById('firebase-status');
      if (typeof db !== 'undefined') {
        status.textContent = "● Connected";
        status.className = "status-indicator status-ready";
      }
    }, 800);
  </script>
</body>
</html>
